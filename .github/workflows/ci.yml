name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  telemetry-interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out health monitor
        uses: actions/checkout@v4
        with:
          path: rtos-system-health-monitor
          persist-credentials: false

      - name: Check out telemetry analyzer
        uses: actions/checkout@v4
        with:
          repository: MarkJoeLittle/telemetry-log-analyzer
          ref: 7ea8f3844c2761490b2337ab43cfbd958a96626e
          path: telemetry-log-analyzer
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure and build health monitor
        working-directory: rtos-system-health-monitor
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target rtos_health_monitor --parallel

      - name: Generate and analyze telemetry
        working-directory: rtos-system-health-monitor
        run: |
          mkdir -p logs
          ./build/rtos_health_monitor --telemetry logs/session.csv --duration 3
          python ../telemetry-log-analyzer/analyzer.py logs/session.csv --expected-interval 1.05

      - name: Record integration revisions
        run: |
          {
            echo "## Telemetry interoperability"
            echo "- Health monitor: \`$(git -C rtos-system-health-monitor rev-parse HEAD)\`"
            echo "- Analyzer: \`$(git -C telemetry-log-analyzer rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload telemetry sample
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-interoperability-csv
          path: rtos-system-health-monitor/logs/session.csv

  proposed-pair-interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out proposed health monitor revision
        uses: actions/checkout@v4
        with:
          ref: 2677f6094a9baf76e5cacabe4fa692660c3c82d5
          path: rtos-system-health-monitor
          persist-credentials: false

      - name: Check out proposed analyzer revision
        uses: actions/checkout@v4
        with:
          repository: MarkJoeLittle/telemetry-log-analyzer
          ref: c097b2cb25a47b15557120bc9b9023b4718cac4b
          path: telemetry-log-analyzer
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure and build proposed health monitor
        working-directory: rtos-system-health-monitor
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target rtos_health_monitor --parallel

      - name: Test proposed producer and analyzer pair
        working-directory: telemetry-log-analyzer
        env:
          RTOS_HEALTH_MONITOR_EXECUTABLE: ../rtos-system-health-monitor/build/rtos_health_monitor
        run: python -m unittest tests/test_health_monitor_integration.py -v

      - name: Record proposed pair revisions
        run: |
          {
            echo "## Proposed telemetry pair"
            echo "- Health monitor: \`$(git -C rtos-system-health-monitor rev-parse HEAD)\`"
            echo "- Analyzer: \`$(git -C telemetry-log-analyzer rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
